name: ddia-replication-lag

x-postgres: &postgres
  image: postgres:18.6-bookworm
  environment: &environment
    PGDATA: /var/lib/postgresql/18/docker
    POSTGRES_DB: ddia
    POSTGRES_USER: ddia_admin
    # Public, disposable learning credentials. Never reuse outside this local lab.
    POSTGRES_PASSWORD: ddia_local_admin
    PGPASSWORD: ddia_local_admin
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    DDIA_APP_USER: ddia_app
    DDIA_APP_PASSWORD: ddia_local_app
    DDIA_REPLICATION_PASSWORD: ddia_local_replication
  command:
    - postgres
    - -c
    - listen_addresses=*
    - -c
    - hba_file=/opt/ddia/pg_hba.conf
    - -c
    - wal_level=replica
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=2
    - -c
    - max_slot_wal_keep_size=256MB
    - -c
    - synchronous_commit=on
    - -c
    - synchronous_standby_names=
    - -c
    - hot_standby=on
  healthcheck:
    test: [CMD, bash, /opt/ddia/healthcheck.sh]
    interval: 2s
    timeout: 5s
    start_period: 10s
    retries: 60
  stop_grace_period: 30s

services:
  primary:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: primary
    entrypoint: [bash, /opt/ddia/primary-entrypoint.sh]
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - primary-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

  replica1:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: replica1
    entrypoint: [bash, /opt/ddia/replica-entrypoint.sh]
    depends_on:
      primary:
        condition: service_healthy
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - replica1-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

  replica2:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: replica2
    entrypoint: [bash, /opt/ddia/replica-entrypoint.sh]
    depends_on:
      primary:
        condition: service_healthy
    ports: ["127.0.0.1:15434:5432"]
    volumes:
      - replica2-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

volumes:
  primary-data:
  replica1-data:
  replica2-data:
