name: ddia-replication-lag

x-postgres: &postgres
  image: postgres:18.6-bookworm
  # Fixed per-node resources so that write-load results are comparable between runs,
  # and so that adding a node later adds capacity instead of sharing the whole VM.
  cpus: 2
  mem_limit: 1g
  environment: &environment
    PGDATA: /var/lib/postgresql/18/docker
    POSTGRES_DB: ddia
    POSTGRES_USER: ddia_admin
    # Public, disposable learning credentials. Never reuse outside this local lab.
    POSTGRES_PASSWORD: ddia_local_admin
    PGPASSWORD: ddia_local_admin
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    DDIA_APP_USER: ddia_app
    DDIA_APP_PASSWORD: ddia_local_app
    DDIA_REPLICATION_PASSWORD: ddia_local_replication
  command:
    - postgres
    - -c
    - listen_addresses=*
    - -c
    - hba_file=/opt/ddia/pg_hba.conf
    - -c
    - wal_level=replica
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=2
    # Write-load runs produce WAL faster than a lagging replica replays it.
    - -c
    - max_slot_wal_keep_size=2GB
    - -c
    - track_wal_io_timing=on
    - -c
    - synchronous_commit=on
    - -c
    - synchronous_standby_names=
    - -c
    - hot_standby=on
  healthcheck:
    test: [CMD, bash, /opt/ddia/healthcheck.sh]
    interval: 2s
    timeout: 5s
    start_period: 10s
    retries: 60
  stop_grace_period: 30s

services:
  primary:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: primary
    entrypoint: [bash, /opt/ddia/primary-entrypoint.sh]
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - primary-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

  replica1:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: replica1
    entrypoint: [bash, /opt/ddia/replica-entrypoint.sh]
    depends_on:
      primary:
        condition: service_healthy
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - replica1-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

  replica2:
    <<: *postgres
    environment:
      <<: *environment
      DDIA_NODE: replica2
    entrypoint: [bash, /opt/ddia/replica-entrypoint.sh]
    depends_on:
      primary:
        condition: service_healthy
    ports: ["127.0.0.1:15434:5432"]
    volumes:
      - replica2-data:/var/lib/postgresql
      - .:/opt/ddia:ro
      - ../../labs/postgres_replication:/opt/ddia-lab:ro

  # Write-load generator inside the Compose network, so that host-to-VM port forwarding
  # is not part of the measured path. Started only by labs/postgres_write_load/run.sh.
  # The PostgreSQL image is reused only as a Linux runtime for the prebuilt Go binary.
  loadgen:
    profiles: [load]
    image: postgres:18.6-bookworm
    cpus: 4
    mem_limit: 1g
    entrypoint: [/opt/loadgen/loadgen]
    environment:
      PRIMARY_DATABASE_URL: postgres://ddia_app:ddia_local_app@primary:5432/ddia?sslmode=disable
      ADMIN_DATABASE_URL: postgres://ddia_admin:ddia_local_admin@primary:5432/ddia?sslmode=disable
    volumes:
      - ../../labs/postgres_write_load/bin:/opt/loadgen:ro
      - ../../labs/postgres_write_load/results:/results

volumes:
  primary-data:
  replica1-data:
  replica2-data:
